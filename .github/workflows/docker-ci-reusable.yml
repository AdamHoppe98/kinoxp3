name: Docker CI reusable
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .env file
        run: |
          echo "MYSQL_ROOT_PASSWORD=testroot" >> .env
          echo "MYSQL_DATABASE=kinodb" >> .env
          echo "MYSQL_USER=testuser" >> .env
          echo "MYSQL_PASSWORD=testpass" >> .env
          echo "SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/kinodb" >> .env
          echo "SPRING_DATASOURCE_USERNAME=testuser" >> .env
          echo "SPRING_DATASOURCE_PASSWORD=testpass" >> .env
          echo "SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop" >> .env

      - name: Run and test container
        run: |
          docker compose up -d
          sleep 40
          curl -f http://localhost:8080/actuator/health || exit 1
          docker compose down